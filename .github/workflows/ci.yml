name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - main

concurrency:
  # Approval waits must not block newer main builds or cancel a release in progress.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun run check
      - run: bun test

  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@5584ab068ab9adf7918fac6263df307cdafbf106
    with:
      image_name: ghcr.io/sushiibot/sushii-leveling-bot
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  deploy:
    # Grant this repository access to both the CI App client ID variable and private key secret.
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      statuses: write
      packages: read
      id-token: write
      attestations: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@5584ab068ab9adf7918fac6263df307cdafbf106
    with:
      target: production
      image_name: ghcr.io/sushiibot/sushii-leveling-bot
      artifact_digest: ${{ needs.docker-build.outputs.artifact_digest }}
      environment: production
      require_approval: true
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
